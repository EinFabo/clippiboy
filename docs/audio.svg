<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Audio routing: the detected game, everything else, applications and microphones through the mixer into the main mix and separate tracks">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#101018"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="mix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b52"/>
      <stop offset="1" stop-color="#17122b"/>
    </linearGradient>
    <marker id="tip2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg2)" stroke="#26262c" stroke-width="1.5"/>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="40" y="50" font-size="14" font-weight="700" fill="#5c5c68" letter-spacing="1.6">SOURCES</text>
    <text x="470" y="50" font-size="14" font-weight="700" fill="#5c5c68" letter-spacing="1.6">MIXER</text>
    <text x="716" y="50" font-size="14" font-weight="700" fill="#5c5c68" letter-spacing="1.6">ON SAVE</text>

    <!-- sources -->
    <g>
      <rect x="40" y="72" width="336" height="68" rx="16" fill="#17171d" stroke="#34343d"/>
      <circle cx="76" cy="106" r="14" fill="#4c1d95"/><rect x="69" y="101.5" width="14" height="9" rx="4.5" fill="#a78bfa"/>
      <text x="108" y="102" font-size="18" font-weight="600" fill="#ffffff">The game</text>
      <text x="108" y="122" font-size="12.5" fill="#8a8a96">follows whatever game is detected, on its own track</text>

      <rect x="40" y="152" width="336" height="68" rx="16" fill="#17171d" stroke="#34343d"/>
      <circle cx="76" cy="186" r="14" fill="#4c1d95"/><circle cx="76" cy="186" r="5" fill="#a78bfa"/>
      <text x="108" y="182" font-size="18" font-weight="600" fill="#ffffff">Output device</text>
      <text x="108" y="202" font-size="12.5" fill="#8a8a96">a whole endpoint — or with ⊘ only its leftovers</text>

      <rect x="40" y="232" width="336" height="68" rx="16" fill="#17171d" stroke="#34343d"/>
      <circle cx="76" cy="266" r="14" fill="#4c1d95"/><rect x="71" y="261" width="10" height="10" rx="2" fill="#a78bfa"/>
      <text x="108" y="262" font-size="18" font-weight="600" fill="#ffffff">Application</text>
      <text x="108" y="282" font-size="12.5" fill="#8a8a96">process loopback — Windows 11 (build 20348+)</text>

      <rect x="40" y="312" width="336" height="68" rx="16" fill="#17171d" stroke="#34343d"/>
      <circle cx="76" cy="346" r="14" fill="#4c1d95"/><path d="M76 339 v14" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
      <text x="108" y="342" font-size="18" font-weight="600" fill="#ffffff">Microphone</text>
      <text x="108" y="362" font-size="12.5" fill="#8a8a96">any input device</text>
    </g>

    <!-- arrows into mixer -->
    <g stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#tip2)">
      <path d="M380 106 C 420 106, 420 190, 456 190"/>
      <path d="M380 186 C 420 186, 420 214, 456 214"/>
      <path d="M380 266 C 420 266, 420 238, 456 238"/>
      <path d="M380 346 C 420 346, 420 262, 456 262"/>
    </g>

    <!-- mixer -->
    <rect x="460" y="140" width="182" height="172" rx="20" fill="url(#mix)" stroke="#7c4fd8"/>
    <text x="551" y="184" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">Mixer</text>
    <g text-anchor="middle" font-size="13" fill="#c9c9d3">
      <text x="551" y="216">gain · mute · solo</text>
      <text x="551" y="240">live level per source</text>
    </g>
    <g>
      <rect x="500" y="258" width="10" height="30" rx="5" fill="#8b5cf6"/>
      <rect x="520" y="266" width="10" height="22" rx="5" fill="#a78bfa"/>
      <rect x="540" y="252" width="10" height="36" rx="5" fill="#8b5cf6"/>
      <rect x="560" y="270" width="10" height="18" rx="5" fill="#6d28d9"/>
      <rect x="580" y="262" width="10" height="26" rx="5" fill="#a78bfa"/>
    </g>

    <!-- outputs -->
    <g stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#tip2)">
      <path d="M646 200 C 680 200, 680 148, 712 148"/>
      <path d="M646 252 C 680 252, 680 304, 712 304"/>
    </g>

    <rect x="716" y="96" width="444" height="104" rx="18" fill="#17171d" stroke="#34343d"/>
    <text x="748" y="136" font-size="18" font-weight="600" fill="#ffffff">Main mix — track 1</text>
    <text x="748" y="162" font-size="12.5" fill="#8a8a96">the one track Discord, browsers and players actually play</text>
    <text x="748" y="182" font-size="12.5" fill="#8a8a96">everything without &quot;own track&quot; lands here</text>

    <rect x="716" y="252" width="444" height="104" rx="18" fill="#17171d" stroke="#34343d"/>
    <text x="748" y="292" font-size="18" font-weight="600" fill="#ffffff">Own track — written alongside</text>
    <text x="748" y="318" font-size="12.5" fill="#8a8a96">one AAC file per source, next to the clip in the data directory</text>
    <text x="748" y="338" font-size="12.5" fill="#8a8a96">the mix stays changeable long after the recording</text>

    <text x="40" y="404" font-size="12.5" fill="#8a8a96">A source with its own track keeps it while it is enabled — muted or not. The mixer pushes silence into it instead of dropping the track.</text>
    <text x="40" y="424" font-size="12.5" fill="#8a8a96">⊘ follows applications, not devices: several devices may have it, but an application playing on two of them lands with the upper source.</text>
  </g>
</svg>

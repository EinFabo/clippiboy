# The checks every push to main and every pull request has to pass. Until now
# nothing ran them: a change that broke the build or a test only showed up when
# the release workflow failed, or not at all.
#
# The Rust code also has to be formatted as rustfmt has it and draw no warning
# from clippy: both were brought to zero first, so the gate starts green.
#
# `npm ci --ignore-scripts`: no package's own install script runs here. None is
# needed — esbuild, Tauri's CLI, rollup and the Tailwind engine bring their
# native programs as platform packages, and esbuild's script only checks its
# binary (on Windows it changes nothing).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # Most of the core only compiles on Windows (capture, audio, encoder).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Pinned, so a new Rust release can't turn the clippy and rustfmt gate red
      # overnight: raise it on purpose, together with the fixes it asks for.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            vcam
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      # Type check and bundle; tauri-build also wants `dist` to exist.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --lib --tests -- -D warnings
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: ClippiBoy Camera tests
        working-directory: vcam
        run: cargo test --locked

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Type check and node's own test runner: neither wrangler's workerd nor
      # esbuild has to be set up for that.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

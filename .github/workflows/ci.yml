# The checks every push to main and every pull request has to pass. Until now
# nothing ran them: a change that broke the build or a test only showed up when
# the release workflow failed, or not at all.
#
# Deliberately no clippy `-D warnings` or `cargo fmt --check` yet — the tree has
# warnings today, and a gate that is red from the start teaches everyone to
# ignore it. Those come once the warnings are gone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # Most of the core only compiles on Windows (capture, audio, encoder).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            vcam
      # Type check and bundle; tauri-build also wants `dist` to exist.
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: ClippiBoy Camera tests
        working-directory: vcam
        run: cargo test --locked

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

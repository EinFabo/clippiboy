# Baut den Installer und veröffentlicht ihn als GitHub Release.
#
# Auslöser ist ein Tag wie `v0.2.0`. Der Tag muss zur `version` in
# `src-tauri/tauri.conf.json` passen — daraus liest die App, ob ein Update
# neuer ist als sie selbst.
#
# Einmalig einzurichten (Repository → Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           Inhalt von ~/.clippiboy/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Inhalt von ~/.clippiboy/updater.password
name: Release

on:
  push:
    tags: ["v*"]
  # Für einen Testlauf ohne Tag.
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Das Release anlegen und die Dateien anhängen.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Der Rust-Build ist der lange Teil; ohne Cache dauert jeder Lauf ~15 min.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ffmpeg und ffprobe kommen mit ins Paket, damit die App auf einem
      # fremden Rechner ohne Vorinstallation Clips schreiben kann.
      - run: npm run ffmpeg

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ClippiBoy ${{ github.ref_name }}
          releaseBody: "Installer unten unter *Assets*. Bestehende Installationen melden sich von selbst."
          # Als Entwurf veröffentlichen wäre sicherer, aber der Updater sieht
          # nur fertige Releases — sonst bekommt niemand das Update.
          releaseDraft: false
          prerelease: false
          # Erzeugt zusätzlich `latest.json`, das der Updater abfragt.
          includeUpdaterJson: true

# Builds the installer and publishes it as a GitHub release.
#
# Triggered by a tag like `v0.2.0`. The tag has to match the `version` in
# `src-tauri/tauri.conf.json` — that is what the app reads to tell whether an
# update is newer than itself.
#
# One-time setup (repository → Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.clippiboy/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.clippiboy/updater.password
name: Release

on:
  push:
    tags: ["v*"]
  # For a trial run without a tag.
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Create the release and attach the files.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The Rust build is the long part; without a cache every run takes ~15 min.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ffmpeg and ffprobe go into the package so the app can write clips on
      # someone else's machine with nothing pre-installed.
      - run: npm run ffmpeg

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ClippiBoy ${{ github.ref_name }}
          releaseBody: "Installer below under *Assets*. Existing installations announce it themselves."
          # Publishing as a draft would be safer, but the updater only sees
          # finished releases — otherwise nobody gets the update.
          releaseDraft: false
          prerelease: false
          # Additionally produces `latest.json`, which the updater queries.
          includeUpdaterJson: true

# Publishes site/ to GitHub Pages: https://einfabo.github.io/clippiboy/ — served at
# https://clippiboy.com through the worker in server/site-proxy.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Runs on changes to site/ and after every finished release: the latest version,
# its size, the direct links and the download count are written into the page
# here (.github/scripts/bake-release.mjs), not looked up by every visitor's
# browser. The browser only asks GitHub itself if release.json is missing.

name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", ".github/scripts/bake-release.mjs"]
  workflow_dispatch:
  # After the release workflow, not on the tag: only then are the installer and
  # the plugin attached. A page baked earlier would link a release without them.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed release has nothing new to show.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Write the latest release into the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/bake-release.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

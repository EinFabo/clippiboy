# Publishes site/ to GitHub Pages: https://einfabo.github.io/clippiboy/
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The page reads the latest release from the GitHub API in the browser, so a new
# release needs no redeploy — only changes to site/ do.

name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes site/ to GitHub Pages: https://einfabo.github.io/clippiboy/ — served at
# https://clippiboy.com through the worker in server/site-proxy.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Runs on changes to site/ and after every finished release: the latest version,
# its size and the direct links are written into the page here
# (.github/scripts/bake-release.mjs), not looked up by every visitor's browser.
# The browser only asks GitHub itself if release.json is missing. The download
# count is not baked: main.js reads it live from clippiboy.com/stats.json.

name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", ".github/scripts/bake-release.mjs"]
  workflow_dispatch:
  # After the release workflow, not on the tag: only then are the installer and
  # the plugin attached. A page baked earlier would link a release without them.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed release has nothing new to show.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Write the latest release into the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/bake-release.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

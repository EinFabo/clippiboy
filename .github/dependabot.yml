# Keeps the workflows' actions up to date. They are pinned to a commit with the
# version as a comment; Dependabot moves both together, one pull request a week
# for all of them, and only to releases a week old — a hijacked release is
# usually found and pulled within days.
#
# Only the actions: the npm and Cargo locks are updated by hand, with the
# build run on them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Workflows:"
